<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CyberShield</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🛡️ CyberShield
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="report.html">
                Report Incident
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>



    <!-- LOGIN CONTAINER -->

    <div class="auth-container">


        <div class="auth-box">


            <div class="login-icon">
                🔐
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="login-subtitle">
                Login to your CyberShield account
            </p>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >



                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >



                <button type="submit">

                    🔐 Login

                </button>


            </form>



            <!-- MESSAGE -->

            <p id="message"></p>



            <div class="register-text">

                Don't have an account?

                <a href="#"
                   onclick="registerUser()">

                    Create Account

                </a>

            </div>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="js/login.js"></script>


</body>

</html>
